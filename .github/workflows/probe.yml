name: probe

# MATLAB builtins on fixed inputs, twice per job (same machine) and in several jobs per system
# (other machines): which operation changes, and between which machines. Started by hand.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runners, as a JSON list
        default: '["ubuntu-24.04", "windows-2025", "macos-26"]'
      repeat:
        description: Jobs per runner, as a JSON list
        default: '[1, 2, 3, 4]'

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.rep }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        rep: ${{ fromJSON(inputs.repeat) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
      - name: first run
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -singleCompThread
          command: addpath('tools/matlab'); builtin_probe('probe-a.json')
      - name: second run, same machine
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -singleCompThread
          command: addpath('tools/matlab'); builtin_probe('probe-b.json')
      - name: MKL fixed to its compatible code path
        if: runner.os != 'macOS'
        uses: matlab-actions/run-command@v2
        env:
          MKL_CBWR: COMPATIBLE
        with:
          startup-options: -singleCompThread
          command: addpath('tools/matlab'); builtin_probe('probe-c.json')
      - name: MKL fixed to AVX2
        if: runner.os != 'macOS'
        uses: matlab-actions/run-command@v2
        env:
          MKL_CBWR: AVX2
        with:
          startup-options: -singleCompThread
          command: addpath('tools/matlab'); builtin_probe('probe-d.json')
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}-${{ matrix.rep }}
          path: probe-*.json
